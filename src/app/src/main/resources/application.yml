vk:
  group:
    id: ${VK_GROUP_ID}
  longpoll:
    enabled: ${VK_LONGPOLL_ENABLED:true}
  api:
    version: 5.199
    token: ${VK_API_TOKEN}
  bot:
    id: ${VK_BOT_ID}
    mention: ${VK_BOT_MENTION:@simarel}
aiUseranswerSystemprompt: ${USER_ANSWER_SYSTEM_PROMPT:You are a helpful ai chatbot in a chat.}
aiSumarizationSystemprompt: ${SUMMARY_SYSTEM_PROMPT:You are a chat summarizer. Create a concise summary of the conversation. Provide both a detailed summary (full_summary) and a brief summary (short_summary) highlighting key topics and decisions.}
aiOcrSystemPrompt: ${OCR_SYSTEM_PROMPT:Describe every image in detail and extract all visible text.}
aiGreetingSystemprompt: ${AI_GREETING_SYSTEM_PROMPT:Ты — дружелюбный бот сообщества VK. Поздравляй коротко, тепло и по-русски.}
aiNewsDigestSystemprompt: ${NEWS_DIGEST_SYSTEM_PROMPT:Ты — помощник, который кратко пересказывает, что происходило в чате. Пиши по-русски, структурировано, без выдумок.}
aiProfileSystemprompt: ${AI_PROFILE_SYSTEM_PROMPT:Ты — помощник, который собирает короткое человекочитаемое досье об участнике чата по данным ниже. Пиши по-русски, только по переданным данным, не выдумывай и не раскрывай служебные id, телефоны и контакты.}
aiKnowledgeSystemprompt: "${AI_KNOWLEDGE_SYSTEM_PROMPT:Ты — анализатор переписки. Извлекай факты только о людях из сообщений ниже. Шутка, эксперимент или гипотетическое «если бы» — не факт; если сомневаешься, верни INFERENCE с confidence не выше 0.6. Самоописание автора — SELF_STATEMENT; чужие слова и поздравления — OTHER_STATEMENT или CONGRATULATION. «Только начал изучать» — KNOWLEDGE с valuePayload level=novice. Категории: INTEREST, HABIT, KNOWLEDGE, PROFILE_ATTRIBUTE, SOCIAL, EVENT. Ключ — [a-z0-9._-], до 96 символов. Значение — до 500 символов. День рождения: категория PROFILE_ATTRIBUTE, ключ birthday, значение — как названо (например, «14 мая» или «14.05.1993»); месяц и день сам не нормализуй. Отвечай только JSON.}"
aiChatKnowledgeSummarySystemprompt: "${AI_CHAT_KNOWLEDGE_SUMMARY_SYSTEM_PROMPT:Ты — наблюдатель чата. Сделай связную сводку чата: темы и направления, манера общения, повторяющиеся групповые факты, мемы и шутки. Не пересказывай сообщения по одному, не списком сообщений, не выдумывай. Не более ~2000 символов. Пиши по-русски.}"
aiKnowledgeSummarySystemprompt: "${AI_KNOWLEDGE_SUMMARY_SYSTEM_PROMPT:Ты — составитель сводки профиля человека по фактам из чата. Напиши связный текст: интересы и темы, привычки и рутина, уровень знаний и предпочитаемая глубина, атрибуты профиля, социальные связи, события и планы. Сведи синонимы к одной формулировке, гипотезы помечай словом «возможно», не выдавай шутки за факты, не упоминай источники, даты и id, не более ~2000 символов. Пиши по-русски.}"
greetings:
  cron: "${GREETINGS_CRON:0 0 0 * * ?}"
  timezone: "${GREETINGS_TIMEZONE:Europe/Minsk}"
  hidden-birthdays:
    enabled: "${GREETINGS_HIDDEN_BIRTHDAYS_ENABLED:true}"
statistics:
  timezone: "${STATISTICS_TIMEZONE:Europe/Minsk}"
summary:
  enabled-chats: ${SUMMARY_ENABLED_CHATS:}
  threshold: ${SUMMARY_THRESHOLD:100}
  batch-size: ${SUMMARY_BATCH_SIZE:100}
  system-prompt: ${SUMMARY_SYSTEM_PROMPT:You are a chat summarizer. Create a concise summary of the conversation. Provide both a detailed summary (full_summary) and a brief summary (short_summary) highlighting key topics and decisions.}
decision:
  spam-threshold: ${DECISION_SPAM_THRESHOLD:0.9}
  spam-reply:
    enabled: ${DECISION_SPAM_REPLY_ENABLED:true}
  jailbreak-threshold: ${DECISION_JAILBREAK_THRESHOLD:0.85}
  jailbreak-reply:
    enabled: ${DECISION_JAILBREAK_REPLY_ENABLED:true}
knowledge:
  enabled: ${KNOWLEDGE_ENABLED:true}
  batch-size: ${KNOWLEDGE_BATCH_SIZE:25}
  batch-interval: ${KNOWLEDGE_BATCH_INTERVAL:30m}
  excluded-chat-ids: ${KNOWLEDGE_EXCLUDED_CHAT_IDS:}
  confirm-threshold: ${KNOWLEDGE_CONFIRM_THRESHOLD:0.8}
  evidence-refs-limit: ${KNOWLEDGE_EVIDENCE_REFS_LIMIT:20}
  chat-summary-message-threshold: ${KNOWLEDGE_CHAT_SUMMARY_MESSAGE_THRESHOLD:100}
  chat-summary-interval: ${KNOWLEDGE_CHAT_SUMMARY_INTERVAL:7d}
  summary-fact-threshold: ${KNOWLEDGE_SUMMARY_FACT_THRESHOLD:20}
  summary-interval: ${KNOWLEDGE_SUMMARY_INTERVAL:14d}
  news-personalization:
    enabled: ${KNOWLEDGE_NEWS_PERSONALIZATION_ENABLED:true}
quarkus:
  config:
    locations: application-queues.yml
  application:
    name: vk-bot
  datasource:
    db-kind: postgresql
    devservices:
      enabled: true
    jdbc:
      initial-size: 2
      min-size: 2
      max-size: 20
      acquisition-timeout: 30s
  liquibase:
    migrate-at-start: true
    change-log: db/changelog/db.changelog-master.yaml
  otel:
    logs:
      enabled: true
      level: INFO
    metrics:
      enabled: true
    traces:
      enabled: true
  rest-client:
    scope: jakarta.inject.Singleton
    logging:
      scope: request-response
    vk:
      url: https://api.vk.ru/method
      headers:
        Authorization: Bearer ${vk.api.token}
    vane:
      url: ${VANE_URL}
      scope: jakarta.inject.Singleton
      connect-timeout: 30000
      read-timeout: 120000
  rabbitmq:
    devservices:
      image-name: rabbitmq:latest
  langchain4j:
    log-requests: true
    log-responses: true
    tracing:
      include-prompt: true
      include-completion: true
    openai:
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY:dummy}
      max-retries: 2
      chat-model:
        model-name: ${AI_CHAT_MODEL}
    chat-model:
      provider: openai
    decision-model:
      provider: ollama
    ollama:
      base-url: ${DECISION_URL}
      timeout: 5s
      decision-model:
        model-id: decision
  messaging:
    health:
      retry-5s-queue:
        enabled: false
      retry-30s-queue:
        enabled: false
      retry-1m-queue:
        enabled: false
      retry-15m-queue:
        enabled: false
      retry-1h-queue:
        enabled: false
      dlq-final-queue:
        enabled: false

mp:
  messaging:
    incoming:
      all-events-queue:
        connector: smallrye-rabbitmq
        exchange:
          name: all-events
        queue:
          name: queue
        dead-letter-exchange: retry-5s-exchange
      retry-5s-queue:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-5s-exchange
        queue:
          name: retry-5s
          arguments:
            x-message-ttl: 5000
            x-dead-letter-exchange: all-events
            x-dead-letter-routing-key: queue
      retry-30s-queue:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-30s-exchange
        queue:
          name: retry-30s
          arguments:
            x-message-ttl: 30000
            x-dead-letter-exchange: all-events
            x-dead-letter-routing-key: queue
      retry-1m-queue:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-1m-exchange
        queue:
          name: retry-1m
          arguments:
            x-message-ttl: 60000
            x-dead-letter-exchange: all-events
            x-dead-letter-routing-key: queue
      retry-15m-queue:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-15m-exchange
        queue:
          name: retry-15m
          arguments:
            x-message-ttl: 900000
            x-dead-letter-exchange: all-events
            x-dead-letter-routing-key: queue
      retry-1h-queue:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-1h-exchange
        queue:
          name: retry-1h
          arguments:
            x-message-ttl: 3600000
            x-dead-letter-exchange: all-events
            x-dead-letter-routing-key: queue
      dlq-final-queue:
        connector: smallrye-rabbitmq
        exchange:
          name: dlq-final-exchange
        queue:
          name: dlq-final
    outgoing:
      events-exchange:
        connector: smallrye-rabbitmq
        exchange:
          name: all-events
      retry-5s-out:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-5s-exchange
      retry-30s-out:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-30s-exchange
      retry-1m-out:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-1m-exchange
      retry-15m-out:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-15m-exchange
      retry-1h-out:
        connector: smallrye-rabbitmq
        exchange:
          name: retry-1h-exchange
      dlq-final-out:
        connector: smallrye-rabbitmq
        exchange:
          name: dlq-final-exchange

smallrye:
  messaging:
    observation:
      enabled: true

# Circuit Breaker configuration for VK API
circuit-breaker:
  vk-profile:
    failure-rate-threshold: 50
    delay: 30s
    request-volume-threshold: 10
