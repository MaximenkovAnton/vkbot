name: Kotlin CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build the deployable
        run: |
          ./gradlew :src:app:quarkusBuild
          test -f src/app/build/quarkus-app/quarkus-run.jar
          test ! -e build/quarkus-app

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run detekt and ktlint
        run: ./gradlew detekt ktlintCheck

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests with coverage report and threshold
        run: ./gradlew test coverageReport coverageVerification
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/coverageReport/html
      - name: Generate coverage and test badges
        run: |
          python3 scripts/coverage-badges.py \
            --coverage-xml build/reports/jacoco/coverageReport/coverageReport.xml \
            --test-results 'src/**/build/test-results/test/*.xml' \
            --output-dir build/badges
      - name: Commit coverage and test badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p .github/badges
          cp build/badges/*.svg .github/badges/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          if git diff --cached --quiet; then
            echo "Badges are unchanged"
            exit 0
          fi
          git commit -m "chore: update coverage and test badges [skip ci]"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the capability map
        run: ./scripts/check-capabilities.sh
