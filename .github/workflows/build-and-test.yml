name: Kotlin CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build the deployable
        run: |
          ./gradlew :src:app:quarkusBuild
          test -f src/app/build/quarkus-app/quarkus-run.jar
          test ! -e build/quarkus-app

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run detekt and ktlint
        run: ./gradlew detekt ktlintCheck

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests with coverage report and threshold
        run: ./gradlew test coverageReport coverageVerification
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/coverageReport/html
      - name: Generate coverage and test badges
        run: |
          python3 scripts/coverage-badges.py \
            --coverage-xml build/reports/jacoco/coverageReport/coverageReport.xml \
            --test-results 'src/**/build/test-results/test/*.xml' \
            --output-dir build/badges
      - name: Publish badges to the badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          workdir="$(mktemp -d)"
          if git clone --depth 1 --branch badges "$remote" "$workdir/badges"; then
            :
          else
            git clone --depth 1 "$remote" "$workdir/badges"
            git -C "$workdir/badges" checkout --orphan badges
            git -C "$workdir/badges" rm -rf .
          fi
          cp build/badges/*.svg "$workdir/badges/"
          git -C "$workdir/badges" config user.name "github-actions[bot]"
          git -C "$workdir/badges" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$workdir/badges" add --all
          if git -C "$workdir/badges" diff --cached --quiet; then
            echo "Badges are unchanged"
            exit 0
          fi
          git -C "$workdir/badges" commit -m "chore: update coverage and test badges"
          git -C "$workdir/badges" push origin badges

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the capability map
        run: ./scripts/check-capabilities.sh
